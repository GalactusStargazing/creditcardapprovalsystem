apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: credit-card-app
  labels:
    app: postgres
spec:
  replicas: 1 
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
    labels:
      app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:latest
          imagePullPolicy: IfNotPresent 
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              valueFrom:
              configMapKeyRef:
              name: postgres-config
              key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
              secretKeyRef:
              name: postgres-secret
              key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
            - name: postgres-init
              mountPath: docker-entrypoint-initdb.d
      volumes:
        - name: postgres-init
          configMap:
            name: postgres-init
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc    
