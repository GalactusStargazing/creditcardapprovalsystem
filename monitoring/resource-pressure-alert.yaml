apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: resource-pressure-alerts
  namespace: monitoring
  labels:
    release: monitoring
spec:
  groups:
    - name: resource-pressure
      rules:
        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="credit-card-app"}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="credit-card-app", resource="memory"}) by (pod)
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is near its memory limit"
            description: "{{ $labels.pod }} is using more than 90% of its configured memory limit."
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="credit-card-app"}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="credit-card-app", resource="cpu"}) by (pod)
            > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} is near its CPU limit"
            description: "{{ $labels.pod }} is using more than 90% of its configured CPU limit."
