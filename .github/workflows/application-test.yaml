name: Application Service CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - 'application-service/**'

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Install application-service dependencies
      - name: Install dependencies
        working-directory: ./application-service
        run: |
          pip install -r requirements.txt

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }} \
            ./application-service

      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }}


      # 9. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      # 10. Verify AWS credentials
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity


      # 11. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name credit-card-eks

      # 12. Verify EKS connection
      - name: Verify EKS connection
        run: |
          kubectl get nodes

