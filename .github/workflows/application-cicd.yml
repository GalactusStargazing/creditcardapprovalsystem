name: Application Service CI/CD

on:
  push:
    branches:
      - eks_test
    paths:
      - "application-service/**"

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: credit-card-eks
  K8S_NAMESPACE: credit-card-app
  K8S_DEPLOYMENT: application
  K8S_CONTAINER: application

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install application-service dependencies
      - name: Install dependencies
        working-directory: ./application-service
        run: |
          pip install -r requirements.txt

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 5. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }} \
            ./application-service

      # 6. Install Trivy
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3
        with:
          version: v0.70.0

      # 7. Scan image BEFORE pushing to Docker Hub
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'

      # 8. Push Docker image ONLY if Trivy scan passes
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }}

      # 9. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 10. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 11. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # 12. Verify EKS connection
      - name: Verify EKS connection
        run: |
          kubectl get nodes
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

      # 13. Deploy Application service
      - name: Deploy Application service
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            ${{ env.K8S_CONTAINER }}=${{ secrets.DOCKERHUB_USERNAME }}/credit-card-application-service:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      # 14. Check Application rollout
      - name: Check Application rollout
        run: |
          kubectl rollout status \
            deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m

      # 15. Show final deployment status
      - name: Show deployment status
        run: |
          echo "Deployment:"
          kubectl get deployment \
            ${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}

          echo "-------------------------------"

          echo "Pods:"
          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }}
