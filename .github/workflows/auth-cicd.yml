name : Auth Service

on:
  push:
    branches:
      - develop
    paths:
      -  "auth-service/*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME}}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD}}
          POSTGRES_DB: test_auth_db
        ports:
          -  5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install dependencies
        working-directory: ./auth-service
        run: |
          pip install -r requirements.txt

      - name: run test
        working-directory: ./auth-service
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-auth-service:${{ github.sha}} ./auth-service
          
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-auth-service:${{ github.sha}}
          
      #-------------------------------------------------------------------------  
      
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Auth service
        run: |
          ssh -i ~/.ssh/ec2-key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "kubectl set image deployment/auth \
            auth=${{ secrets.DOCKERHUB_USERNAME }}/credit-card-auth-service:${{ github.sha }} -n credit-card-app"

      - name: Check Auth rollout
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "kubectl rollout status deployment/auth \
            -n credit-card-app"
