name: Frontend Service CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "frontend/*"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install frontend dependencies
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. Build Angular frontend
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      # 5. Run Linting
      - name: Run Lint
        working-directory: ./frontend
        run: ng lint -- --watch=false

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-frontend:${{ github.sha }} \
            ./frontend

      # 8. Push Docker image to Docker Hub
      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-frontend:${{ github.sha }}

      # 9. Setup SSH connection to EC2
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2-key.pem
          chmod 600 ~/.ssh/ec2-key.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

     # 10. Update frontend image in Kubernetes
      - name: Update frontend deployment
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "kubectl set image deployment/frontend \
            frontend=${{ secrets.DOCKERHUB_USERNAME }}/credit-card-frontend:${{ github.sha }} \
            -n credit-card-app"  
            
    # 11. Check Kubernetes rollout
      - name: Check rollout status
        run: |
          ssh -i ~/.ssh/ec2-key.pem \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "kubectl rollout status deployment/frontend \
            -n credit-card-app"
