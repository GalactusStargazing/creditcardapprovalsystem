name: Decision Service CI/CD

on:
  push:
    branches:
      - develop
    paths:
      - "credit-decision-service/**"

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: credit-card-eks
  K8S_NAMESPACE: credit-card-app
  K8S_DEPLOYMENT: decision
  K8S_CONTAINER: decision

jobs:
  code-quality:
    name: Code Quality and Database authentication setup

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: test_decision_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      # 1. Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
         fetch-depth: 0

      # 2. Gitleaks secret scan
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Install decision-service dependencies
      - name: Install dependencies
        working-directory: ./credit-decision-service
        run: |
          pip install -r requirements.txt

      # 5. Run tests
      - name: Run tests
        working-directory: ./credit-decision-service
        env:
          TESTING: "true"
        run: |
          pytest

  build-and-scan:
    name: Build, Scan and Push Image
    runs-on: ubuntu-latest

    needs: code-quality

    steps:

      # Again Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-decision-service:${{ github.sha }} \
            ./credit-decision-service

      # 7. Scan Docker image with Trivy
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ secrets.DOCKERHUB_USERNAME }}/credit-card-decision-service:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "HIGH,CRITICAL"

      # 8. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 9. Push Docker image to Docker Hub
      - name: Push to Docker Hub
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/credit-card-decision-service:${{ github.sha }}

  deploy:
    name: Deploy to AWS EKS
    runs-on: ubuntu-latest

    needs: build-and-scan

    steps:

      # 10. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 11. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 12. Configure kubectl for EKS
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER_NAME }}

      # 13. Verify EKS connection
      - name: Verify EKS connection
        run: |
          kubectl get nodes
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}

      # 14. Deploy Decision service
      - name: Deploy Decision service
        run: |
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} \
            ${{ env.K8S_CONTAINER }}=${{ secrets.DOCKERHUB_USERNAME }}/credit-card-decision-service:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      # 15. Check Decision rollout
      - name: Check Decision rollout
        run: |
          kubectl rollout status \
            deployment/${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=5m

      # 16. Show final deployment status
      - name: Show deployment status
        run: |
          echo "Deployment:"
          kubectl get deployment \
            ${{ env.K8S_DEPLOYMENT }} \
            -n ${{ env.K8S_NAMESPACE }}

          echo "-------------------------------"

          echo "Pods:"
          kubectl get pods \
            -n ${{ env.K8S_NAMESPACE }}
