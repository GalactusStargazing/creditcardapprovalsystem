apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: credit-decision
  namespace: credit-card-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: credit-decision

  minReplicas: 2
  maxReplicas: 8

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60