apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler

metadata:
  name: authservice-hpa
  namespace: credit-card-app

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: authservice

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70