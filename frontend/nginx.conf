server {
    listen 80;
    server_name localhost;
    resolver 10.96.0.10 valid=10s;

    location /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Auth Service
    location /api/v1/auth/ {
        set $auth_upstream http://auth.credit-card-app.svc.cluster.local:8001;
        proxy_pass $auth_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application Service
    location /api/v1/applications/ {
        set $app_upstream http://application.credit-card-app.svc.cluster.local:8002;
        proxy_pass $app_upstream$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Exact match for /api/v1/applications (no trailing slash) - list/create
    location = /api/v1/applications {
        set $app_upstream2 http://application.credit-card-app.svc.cluster.local:8002;
        proxy_pass $app_upstream2$uri$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
