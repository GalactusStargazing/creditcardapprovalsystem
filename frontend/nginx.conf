server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=10s;

    location /health {
        default_type text/plain;
        return 200 'ok';
    }

    # Auth Service
    location /api/v1/auth/ {
	set $auth_upstream http://auth-service:8001;
        proxy_pass $auth_upstream/api/v1/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Application Service
    location /api/v1/applications/ {
	set $app_upstream http://application-service:8002;
        proxy_pass $app_upstream/api/v1/applications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle the exact /api/v1/applications path (no trailing slash) too,
    # since GET/POST /api/v1/applications is used without an ID.
    location = /api/v1/applications {
	set $app_upstream2 http://application-service:8002;
        proxy_pass $app_upstream2/api/v1/applications;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
