apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-autoscaler
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-autoscaler
rules:

  # Events and endpoints
  - apiGroups: [""]
    resources:
      - events
      - endpoints
    verbs:
      - create
      - patch

  # Pod eviction during scale-down
  - apiGroups: [""]
    resources:
      - pods/eviction
    verbs:
      - create

  # Pod status
  - apiGroups: [""]
    resources:
      - pods/status
    verbs:
      - update

  # Leader election endpoint
  - apiGroups: [""]
    resources:
      - endpoints
    resourceNames:
      - cluster-autoscaler
    verbs:
      - get
      - update

  # Nodes
  - apiGroups: [""]
    resources:
      - nodes
    verbs:
      - watch
      - list
      - get
      - update

  # Core Kubernetes resources
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - services
      - replicationcontrollers
      - persistentvolumeclaims
      - persistentvolumes
    verbs:
      - watch
      - list
      - get

  # Extensions workloads
  - apiGroups: ["extensions"]
    resources:
      - replicasets
      - daemonsets
    verbs:
      - watch
      - list
      - get

  # Apps workloads
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - replicasets
      - daemonsets
    verbs:
      - watch
      - list
      - get

  # Pod disruption budgets
  - apiGroups: ["policy"]
    resources:
      - poddisruptionbudgets
    verbs:
      - watch
      - list

  # Resource management / DRA
  - apiGroups: ["resource.k8s.io"]
    resources:
      - deviceclasses
      - resourceslices
      - resourceclaims
    verbs:
      - watch
      - list
      - get

  # Storage / CSI resources
  - apiGroups: ["storage.k8s.io"]
    resources:
      - storageclasses
      - csinodes
      - csidrivers
      - csistoragecapacities
      - volumeattachments
    verbs:
      - watch
      - list
      - get

  # Jobs
  - apiGroups: ["batch", "extensions"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - patch

  # Leader election using Kubernetes Lease
  - apiGroups: ["coordination.k8s.io"]
    resources:
      - leases
    verbs:
      - create

  - apiGroups: ["coordination.k8s.io"]
    resourceNames:
      - cluster-autoscaler
    resources:
      - leases
    verbs:
      - get
      - update

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-autoscaler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cluster-autoscaler
  namespace: kube-system
rules:

  # CA status ConfigMaps
  - apiGroups: [""]
    resources:
      - configmaps
    verbs:
      - create
      - list
      - watch

  - apiGroups: [""]
    resources:
      - configmaps
    resourceNames:
      - cluster-autoscaler-status
      - cluster-autoscaler-priority-expander
    verbs:
      - delete
      - get
      - update
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cluster-autoscaler
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-autoscaler
subjects:
  - kind: ServiceAccount
    name: cluster-autoscaler
    namespace: kube-system

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-autoscaler
  namespace: kube-system
spec:
  replicas: 1

  selector:
    matchLabels:
      app: cluster-autoscaler

  template:
    metadata:
      labels:
        app: cluster-autoscaler

    spec:
      serviceAccountName: cluster-autoscaler

      priorityClassName: system-cluster-critical

      containers:
        - name: cluster-autoscaler

          image: registry.k8s.io/autoscaling/cluster-autoscaler:v1.36.1

          imagePullPolicy: IfNotPresent

          command:
            - ./cluster-autoscaler

            # AWS provider
            - --cloud-provider=aws

            # Automatically discover ASGs using CA tags
            - --node-group-auto-discovery=asg:tag=k8s.io/cluster-autoscaler/enabled,k8s.io/cluster-autoscaler/credit-card-eks

            # Node group balancing
            - --balance-similar-node-groups=false

            # Scale-down behavior
            - --scale-down-utilization-threshold=0.70
            - --scale-down-unneeded-time=5m
            - --scale-down-delay-after-add=5m
            - --scale-down-delay-after-delete=5m

            # Allow CA to consider nodes containing local-storage/system pods
            - --skip-nodes-with-local-storage=false
            - --skip-nodes-with-system-pods=false

            # Logging
            - --stderrthreshold=info

          resources:
            requests:
              cpu: 100m
              memory: 300Mi

            limits:
              cpu: 200m
              memory: 500Mi