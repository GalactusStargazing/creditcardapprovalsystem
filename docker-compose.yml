services:
  db:
    image: postgres:16-alpine
    container_name: ccs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ccs_network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    image: ccs-auth-service:latest
    container_name: ccs_auth_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES}
      PORT: 8001
    ports:
      - "${AUTH_PORT:-8001}:8001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ccs_network

  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    image: ccs-application-service:latest
    container_name: ccs_application_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/application_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM}
      CREDIT_DECISION_SERVICE_URL: http://decision-service:8003
      PORT: 8002
    ports:
      - "${APPLICATION_PORT:-8002}:8002"
    depends_on:
      db:
        condition: service_healthy
      decision-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ccs_network

  decision-service:
    build:
      context: ./credit-decision-service
      dockerfile: Dockerfile
    image: ccs-decision-service:latest
    container_name: ccs_decision_service
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/decision_db
      PORT: 8003
    ports:
      - "${DECISION_PORT:-8003}:8003"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ccs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ccs-frontend:latest
    container_name: ccs_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      auth-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ccs_network

volumes:
  db_data:
    name: ccs_db_data

networks:
  ccs_network:
    driver: bridge
